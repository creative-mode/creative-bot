name: Auditoria mensal de dependências

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-audit:
    name: Dependências Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        continue-on-error: true
        run: |
          set +e
          {
            echo '### Bun dependency audit'
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          bun audit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          {
            echo '```'
            echo
            echo "Audit exit status: $status (the scheduled audit is non-blocking by design)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
