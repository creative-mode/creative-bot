name: CI

on:
  push:
    branches:
      - PRD
      - QUA
      - DEV
  pull_request:
    branches:
      - PRD
      - QUA
      - DEV

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Enquanto não houver testes, --pass-with-no-tests evita falhar o build.
      - name: Run tests
        run: bun test --pass-with-no-tests --coverage

  bots:
    name: Bots scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testar os scripts dos bots
        run: node --test .github/scripts/bots.test.cjs

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Só confirma que a imagem compila; a publicação está em publish.yml (PRD).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=creative-bot
